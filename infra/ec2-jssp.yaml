AWSTemplateFormatVersion: '2010-09-09'
Description: JSSP benchmark VM - Ubuntu x86_64, 4 vCPU, 32 GiB, SSH only
Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu Server 24.04 LTS x86_64 AMI in the selected region
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the chosen VPC with route to Internet Gateway
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  SshCidr:
    Type: String
    Description: Your public IPv4 address followed by /32
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from owner only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: r6i.xlarge
      KeyName: !Ref KeyName
      MetadataOptions:
        HttpTokens: required
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: jssp-benchmark
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3.12 python3.12-venv python3-pip git build-essential unzip tmux
Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt Instance.PublicIp
